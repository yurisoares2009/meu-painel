<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Novo Pagamento - Meu Painel</title>

    <link
        rel="stylesheet"
        href="./style.css"
    >

</head>


<body class="painel-body">


    <!-- MENU LATERAL -->

    <aside class="menu">

        <div class="logo">

            <h2>MEU PAINEL</h2>

            <span>Gestão de Sites</span>

        </div>


        <nav>

            <button onclick="mostrarInicio()">
                🏠 Início
            </button>

            <button onclick="mostrarSitesMenu()">
                🌐 Meus Sites
            </button>

            <button onclick="abrirClientes()">
                👥 Clientes
            </button>

            <button onclick="abrirFinanceiro()">
                💰 Financeiro
            </button>

            <button>
                ⚙️ Configurações
            </button>

        </nav>


        <div class="menu-final">

            <button
                class="botao-sair"
                onclick="sair()"
            >
                🚪 Sair
            </button>

        </div>

    </aside>



    <!-- CONTEÚDO -->

    <section class="conteudo">


        <!-- TOPO -->

        <header class="topo">

            <div>

                <h1>
                    Novo Pagamento
                </h1>

                <p>
                    Cadastre um pagamento do cliente.
                </p>

            </div>


            <button
                class="botao-novo"
                onclick="abrirFinanceiro()"
            >
                ← VOLTAR
            </button>

        </header>



        <!-- FORMULÁRIO -->

        <div class="formulario">

            <h1>
                Dados do Pagamento
            </h1>

            <p>
                Preencha as informações abaixo.
            </p>



            <!-- CLIENTE -->

            <label>
                Cliente *
            </label>

            <select id="clientePagamento">

                <option value="">
                    Selecione o cliente
                </option>

            </select>



            <!-- VALOR -->

            <label>
                Valor *
            </label>

            <input
                type="number"
                id="valorPagamento"
                placeholder="Ex: 450.00"
                step="0.01"
                min="0"
            >



            <!-- VENCIMENTO -->

            <label>
                Data de vencimento *
            </label>

            <input
                type="date"
                id="vencimentoPagamento"
            >



            <!-- MÊS -->

            <label>
                Mês de referência *
            </label>

            <input
                type="month"
                id="mesPagamento"
            >



            <!-- STATUS -->

            <label>
                Status *
            </label>

            <select id="statusPagamento">

                <option value="Pendente">
                    🟡 Pendente
                </option>

                <option value="Pago">
                    🟢 Pago
                </option>

                <option value="Atrasado">
                    🔴 Atrasado
                </option>

            </select>



            <!-- OBSERVAÇÕES -->

            <label>
                Observações
            </label>

            <textarea
                id="observacoesPagamento"
                placeholder="Digite alguma informação sobre este pagamento..."
            ></textarea>



            <!-- BOTÃO -->

            <button
                onclick="salvarPagamento()"
            >
                SALVAR PAGAMENTO
            </button>


        </div>


    </section>



    <script src="./script.js"></script>

</body>

</html>
