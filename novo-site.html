<!DOCTYPE html>

<html lang="pt-BR">

<head>

```
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Novo Site - Meu Painel</title>

<link
    rel="stylesheet"
    href="./style.css"
>
```

</head>

<body class="painel-body">

```
<!-- ==========================================
     MENU LATERAL
========================================== -->

<aside class="menu">


    <div class="logo">

        <h2>
            MEU PAINEL
        </h2>

        <span>
            Gestão de Sites
        </span>

    </div>


    <nav>


        <button onclick="mostrarInicio()">
            🏠 Início
        </button>


        <button onclick="mostrarSitesMenu()">
            🌐 Meus Sites
        </button>


        <button onclick="abrirClientes()">
            👥 Clientes
        </button>


        <button onclick="abrirFinanceiro()">
            💰 Financeiro
        </button>


        <button>
            ⚙️ Configurações
        </button>


    </nav>


    <div class="menu-final">


        <button
            class="botao-sair"
            onclick="sair()"
        >
            🚪 Sair
        </button>


    </div>


</aside>



<!-- ==========================================
     CONTEÚDO
========================================== -->

<section class="conteudo">


    <!-- ======================================
         CABEÇALHO
    ====================================== -->

    <header class="topo">


        <div>

            <h1>
                Novo Site
            </h1>


            <p>
                Cadastre um novo site de cliente.
            </p>

        </div>


        <button
            class="botao-novo"
            onclick="voltar()"
        >
            ← VOLTAR
        </button>


    </header>



    <!-- ======================================
         FORMULÁRIO
    ====================================== -->

    <div class="formulario">


        <h1>
            Dados do Site
        </h1>


        <p>
            Preencha as informações abaixo.
        </p>



        <!-- ==================================
             CLIENTE
        ================================== -->

        <label for="clienteDoSite">
            Cliente *
        </label>


        <select
            id="clienteDoSite"
            required
        >

            <option value="">
                Carregando clientes...
            </option>

        </select>



        <!-- ==================================
             NOME DO SITE
        ================================== -->

        <label for="nomeSite">
            Nome do site *
        </label>


        <input
            type="text"
            id="nomeSite"
            placeholder="Ex: Site Mercado do João"
            required
        >



        <!-- ==================================
             ENDEREÇO DO SITE
        ================================== -->

        <label for="url">
            Endereço do site *
        </label>


        <input
            type="url"
            id="url"
            placeholder="https://www.exemplo.com.br"
            required
        >



        <!-- ==================================
             CATEGORIA
        ================================== -->

        <label for="categoria">
            Categoria
        </label>


        <select
            id="categoria"
        >


            <option value="Comércio">
                Comércio
            </option>


            <option value="Restaurante">
                Restaurante
            </option>


            <option value="Serviços">
                Serviços
            </option>


            <option value="Empresa">
                Empresa
            </option>


            <option value="Profissional">
                Profissional
            </option>


        </select>



        <!-- ==================================
             STATUS
        ================================== -->

        <label for="status">
            Status
        </label>


        <select
            id="status"
        >


            <option value="🟢 ONLINE">
                🟢 ONLINE
            </option>


            <option value="🟡 MANUTENÇÃO">
                🟡 MANUTENÇÃO
            </option>


            <option value="🔴 OFFLINE">
                🔴 OFFLINE
            </option>


        </select>



        <!-- ==================================
             OBSERVAÇÕES
        ================================== -->

        <label for="observacoes">
            Observações
        </label>


        <textarea
            id="observacoes"
            placeholder="Informações sobre o site..."
        ></textarea>



        <!-- ==================================
             BOTÃO SALVAR
        ================================== -->

        <button
            type="button"
            onclick="salvarOuAtualizar()"
        >
            SALVAR SITE
        </button>


    </div>


</section>



<!-- ==========================================
     BIBLIOTECA SUPABASE
========================================== -->

<script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"
></script>



<!-- ==========================================
     CONFIGURAÇÃO SUPABASE
========================================== -->

<script src="./supabase-config.js"></script>



<!-- ==========================================
     SISTEMA PRINCIPAL
========================================== -->

<script src="./script.js"></script>
```

</body>

</html>
