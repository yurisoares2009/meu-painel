<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Meu Painel</title>

    <link
        rel="stylesheet"
        href="./style.css"
    >

</head>

<body>

    <div class="login-container">

        <div class="login-box">

            <h1>MEU PAINEL</h1>

            <p>Gerencie seus sites</p>

            <input
                type="email"
                id="usuario"
                placeholder="E-mail"
            >

            <input
                type="password"
                id="senha"
                placeholder="Senha"
            >

            <button onclick="entrar()">
                ENTRAR
            </button>

            <p id="erro"></p>

        </div>

    </div>


    <!-- ===================================== -->
    <!-- SUPABASE -->
    <!-- ===================================== -->

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"
    ></script>

    <script>
        // Verifica se a biblioteca do Supabase carregou
        console.log(
            "Biblioteca Supabase:",
            window.supabase
        );
    </script>


    <!-- ===================================== -->
    <!-- CONFIGURAÇÃO SUPABASE -->
    <!-- ===================================== -->

    <script src="./supabase-config.js"></script>


    <!-- ===================================== -->
    <!-- SISTEMA DO PAINEL -->
    <!-- ===================================== -->

    <script src="./script.js"></script>

</body>

</html>
