<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Meu Painel</title>

    <!-- LIGAÇÃO COM O CSS -->
    <link rel="stylesheet" href="./style.css">

</head>


<body>


    <!-- LOGIN -->

    <div class="login-container">


        <div class="login-box">


            <h1>
                MEU PAINEL
            </h1>


            <p>
                Gerencie seus sites
            </p>


            <input
                type="text"
                id="usuario"
                placeholder="Usuário"
            >


            <input
                type="password"
                id="senha"
                placeholder="Senha"
            >


            <button onclick="entrar()">
                ENTRAR
            </button>


            <p id="erro"></p>


        </div>


    </div>


    <!-- LIGAÇÃO COM O JAVASCRIPT -->

    <script src="./script.js"></script>


</body>

</html>
